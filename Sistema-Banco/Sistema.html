<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>
    <link rel="stylesheet" href="Sistema.css">
</head>
<body>
    

    <main class="main">
        
        <div class="group-navigations">
            <button class="button-operations-members" id="button-operations-members">Membros</button>
            <button class="button-operations-publications" id="button-operations-publications">Publicações</button>
        </div>

        <!--Areas de membros e publicações-->

        <div class="group-operations">

            <!--Area membros-->

            <div class="group-member">
                <form class="invit-member">
                    <h2 class="title">Adicionar Membro</h2>
                    <div class="group-input-0">
                        <label>Nome</label>
                        <input type="text" name="nome" class="input" placeholder="Nome completo">
                    </div>
                    <div class="group-input-0">
                        <label>Curso</label>
                        <input type="text" name="curso" class="input" placeholder="Ex: ENG.telecomunicações">
                    </div>
                    <div class="group-input-0">
                        <label>Time</label>
                        <input type="text" name="time" class="input" placeholder="Ex: Hardware">
                    </div>
                    <div class="group-input-0">
                        <label>Link Lattes</label>
                        <input type="text" name="lattes" class="input" placeholder="Opcional">
                    </div>
                    <div class="group-input-0">
                        <label>Status</label>
                        <input type="text" name="status" class="input" placeholder="Ex: Ativo">
                    </div>
                    <button type="submit" class="button-member" id="button-invit-member">Enviar</button>
                </form>
                <div class="list-members">
                    <span class="text-load">Nenhum dado encontrado</span>
                </div>
            </div>

            <!--Area Publicações-->

            <div class="group-publications">
                <div class="div-navigate">
                    <button class="button-left" id="button-left">L</button>
                </div>
                
                <form class="invit-publication">
                    <div class="titles">
                        <h2 class="title">Adicionar Publicação</h2>
                        <p class="subtitle">Preencha todos os campus</p>
                    </div>
                    
                    <div class="group-input-2">
                        <div class="group-input-4">
                            <div class="group-input-1">
                                <label>Tipo de publicação</label>
                                <input type="text" name="tipo" class="input" placeholder="Ex: TCC">
                            </div>
                            <div class="group-input-3">
                                <div class="group-local">
                                    <label>Local de divulgação</label>
                                    <input type="text" name="local" class="input" placeholder="Ex: IFTO, Campus Palmas">
                                </div>
                                <div class="group-year">
                                    <label>Ano de divulgação</label>
                                    <input type="number" name="ano" class="input" placeholder="2026">
                                </div>
                            </div>
                            <div class="group-input-1">
                                <label>Titulo da publicação</label>
                                <textarea class="textarea-title" name="titulo" placeholder="Titulo Completo"></textarea>
                            </div>
                        </div>
                        <div class="group-input-4">
                            <label>Texto da publicação</label>
                            <textarea class="textarea-text" name="texto" placeholder="Texto completo"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="button-invit-publication" class="button-invit-publication">Enviar</button>
                </form>
                <div class="list-publications">
                    <span class="text-load">Nenhuma publicação encontrada</span>
                </div>
                <div class="div-navigate">
                    <button class="button-right" id="button-right">R</button>
                </div>
                
            </div>  
        </div>

        <!--area de edição-->
        <div class="blur">
            <form class="div-edit-member">
                <h2 class="title">Editar membro</h2>
                <div class="group-input-0">
                    <label>Nome</label>
                    <input type="text" class="input" id="input-name-edit" name="nome" placeholder="Nome completo">
                </div>
                <div class="group-input-0">
                    <label>Curso</label>
                    <input type="text" class="input" id="input-course-edit" name="curso" placeholder="Ex: ENG.telecomunicações">
                </div>
                <div class="group-input-0">
                    <label>Time</label>
                    <input type="text" class="input" id="input-time-edit" name="time" placeholder="Ex: Software">
                </div>
                <div class="group-input-0">
                    <label>Lattes</label>
                    <input type="text" class="input" id="input-lattes-edit" name="lattes" placeholder="Opcional">
                </div>
                <div class="group-input-0">
                    <label>Status</label>
                    <input type="text" class="input" id="input-status-edit" name="status" placeholder="Ex: Ativo">
                </div>
                <button type="submit" id="button-edit-member" class="button-member">Editar</button>
            </form>

            <form class="edit-publication">
                <div class="titles">
                    <h2 class="title">Editar Publicação</h2>
                    <p class="subtitle">Preencha todos os campus</p>
                </div>
                    
                <div class="group-input-2">
                    <div class="group-input-4">
                        <div class="group-input-1">
                            <label>Tipo de publicação</label>
                            <input type="text" name="tipo" id="input-tipo-edit" class="input" placeholder="Ex: TCC">
                        </div>
                        <div class="group-input-3">
                            <div class="group-local">
                                <label>Local de divulgação</label>
                                <input type="text" name="local" id="input-local-edit" class="input" placeholder="Ex: IFTO, Campus Palmas">
                            </div>
                            <div class="group-year">
                                <label>Ano de divulgação</label>
                                <input type="number" name="ano" id="input-ano-edit" class="input" placeholder="2026">
                            </div>
                        </div>
                        <div class="group-input-1">
                            <label>Titulo da publicação</label>
                            <textarea class="textarea-title" name="titulo" id="textarea-titulo-edit" placeholder="Titulo Completo"></textarea>
                        </div>
                    </div>
                    <div class="group-input-4">
                        <label>Texto da publicação</label>
                        <textarea class="textarea-text" name="texto" id="textarea-texto-edit" placeholder="Texto completo"></textarea>
                    </div>
                </div>
                <button type="submit" id="button-edit-publication" class="button-invit-publication" class="button-invit-publication">Enviar</button>
            </form>
        </div>
    </main>

    <script src="Sistema.js"></script>
    <script src="SistemaLayout.js"></script>
</body>
</html>
